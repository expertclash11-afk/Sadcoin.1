<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SadCat Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --bg: #0f1520; --panel: #18202e; --panel2: #202a3b; --line: #2a3548;
    --text: #e6ebf5; --mute: #8793aa;
    --brass: #e0a93b; --brass-hi: #f3d58a; --tear: #7cc7ff;
    --good: #6fd3a0; --bad: #ef6a6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    height: var(--tg-viewport-stable-height, 100dvh);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 15px/1.35 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
b, .num { font-variant-numeric: tabular-nums; }

/* Шапка */
.hud { display: flex; justify-content: space-between; align-items: center;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 12px; border-bottom: 1px solid var(--line); }
.hud .lbl { color: var(--mute); font-size: 12px; }
.hud .bal { font-size: 30px; font-weight: 800; line-height: 1.1; color: var(--brass-hi); letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.hud .en { font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }

/* Контент */
#view { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
h2 { margin: 0 0 12px; font-size: 20px; font-weight: 800; }
.sub { color: var(--mute); font-size: 13px; }

/* Нижнее меню */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: repeat(6, 1fr);
    background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tabs button { background: none; border: 0; padding: 9px 0 8px; color: var(--mute); font-size: 11px; font-weight: 600; position: relative; }
#tabs button span { display: block; font-size: 20px; margin-bottom: 1px; }
#tabs button.on { color: var(--brass-hi); }
#tabs button.on::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 2px; background: var(--brass); border-radius: 2px; }

/* Панели и кнопки */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 800; color: #2a1c04; background: var(--brass); white-space: nowrap; transition: transform .08s; }
.btn:active { transform: scale(.95); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 700; }
.btn.bad { background: transparent; color: var(--bad); border: 1px solid rgba(239,106,106,.35); }
.btn.good { background: var(--good); color: #06281a; }
.btn.wide { width: 100%; padding: 13px; }
.dim { opacity: .45; }
.bar { height: 10px; background: #0b111b; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 6px; }
.bar.thin { height: 6px; }
.bar.thin i { background: var(--brass); }

/* Редкость */
.r0 { --rc: #9aa6bd; } .r1 { --rc: #5db4f0; } .r2 { --rc: #b98cf5; } .r3 { --rc: #f2c14e; }
.rt { color: var(--rc); }
.rbar { border-left: 3px solid var(--rc); }

/* Экран тапа */
.tap { min-height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
.stats { display: flex; justify-content: center; gap: 36px; text-align: center; }
.stats b { display: block; font-size: 20px; }
.stats span { color: var(--mute); font-size: 12px; }
#coin { align-self: center; border: 0; background: none; padding: 0; width: min(76vw, 310px, 44dvh); aspect-ratio: 1;
    touch-action: none; transition: transform .07s cubic-bezier(.2,1.5,.4,1); filter: drop-shadow(0 16px 26px rgba(224,169,59,.22)); }
#coin:active { transform: scale(.93) rotate(-1.5deg); }
#coin svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.energy .row { margin-bottom: 6px; font-size: 13px; color: var(--mute); }
.energy b { color: var(--good); }

/* Кот: слёзы и усталость */
.tear { opacity: 0; transform-box: fill-box; transform-origin: center; }
.cry .tear { animation: drop .8s ease-in forwards; }
.tired .tear { animation: drip 2.4s ease-in infinite; }
.tired .tear.t2 { animation-delay: 1.2s; }
.lid { transition: transform .3s; }
.tired .lid { transform: translateY(5px); }
@keyframes drop { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(40px); } }
@keyframes drip { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(40px); } }

.fnum { position: fixed; z-index: 60; pointer-events: none; font-weight: 800; font-size: 24px; color: var(--brass-hi);
    text-shadow: 0 2px 6px rgba(0,0,0,.8); animation: up .6s ease-out forwards; }
@keyframes up { 0% { transform: translate(-50%, 0) scale(.8); opacity: 1; } 100% { transform: translate(-50%, -110px) scale(1.1); opacity: 0; } }

/* Тосты и окно */
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 78px); transform: translateX(-50%); z-index: 200;
    padding: 9px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; pointer-events: none; animation: tin .18s ease-out;
    background: var(--good); color: #06281a; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
.toast.err { background: var(--bad); color: #fff; }
@keyframes tin { from { opacity: 0; margin-top: -10px; } to { opacity: 1; margin-top: 0; } }
#modal { position: fixed; inset: 0; z-index: 100; background: rgba(5,8,14,.86); display: flex; align-items: center; justify-content: center; padding: 18px; }
.sheet { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.rl-view { position: relative; overflow: hidden; border-radius: 14px; background: #0b111b; border: 1px solid var(--line); padding: 12px 0; }
.rl-strip { position: relative; display: flex; will-change: transform; }
.rl-item { flex: none; width: 104px; height: 112px; margin-right: 8px; border-radius: 12px; border: 2px solid var(--rc);
    background: var(--panel2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 4px; }
.rl-item .ic { font-size: 28px; } .rl-item .nm { font-size: 11px; font-weight: 700; line-height: 1.15; }
.rl-mark { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--brass-hi); box-shadow: 0 0 10px var(--brass); z-index: 2; }
.pop { animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }

input.ref { width: 100%; background: #0b111b; border: 1px solid var(--line); border-radius: 10px; padding: 9px; color: var(--brass-hi); font: 12px ui-monospace, monospace; margin: 8px 0; }

@media (prefers-reduced-motion: reduce) {
    .fnum, .toast, .pop, .cry .tear { animation-duration: .01s; }
    .tired .tear { animation: none; opacity: 1; }
    #coin { transition: none; }
}
</style>
</head>
<body>

<header class="hud">
    <div><div class="lbl">SadCoin</div><div class="bal" id="balance">0</div></div>
    <div class="en">⚡ <span id="energy">0/0</span></div>
</header>
<main id="view"></main>
<nav id="tabs">
    <button data-act="tab" data-key="tap" class="on"><span>🐱</span>Кот</button>
    <button data-act="tab" data-key="cases"><span>🎁</span>Кейсы</button>
    <button data-act="tab" data-key="inv"><span>🎒</span>Вещи</button>
    <button data-act="tab" data-key="up"><span>⚡</span>Прокачка</button>
    <button data-act="tab" data-key="tasks"><span>📋</span>Задания</button>
    <button data-act="tab" data-key="top"><span>🏆</span>Топ</button>
</nav>

<script>
'use strict';
/* ======================= Telegram и окружение ======================= */
const P = new URLSearchParams(location.search);
const tg = window.Telegram?.WebApp || {
    initData: '', ready() {}, expand() {}, showAlert: m => alert(m),
    showConfirm: (m, cb) => cb(confirm(m)), openTelegramLink: u => window.open(u, '_blank'), HapticFeedback: null
};
tg.ready(); tg.expand();
tg.setHeaderColor?.('#0f1520'); tg.setBackgroundColor?.('#0f1520'); tg.disableVerticalSwipes?.();

// Вне Telegram: ?dev — тест против локального сервера (DEV=1), иначе встроенное демо.
const initData = tg.initData || (P.has('dev') ? 'dev:1:Dev' : '');
const DEMO = !initData;

const hap = {
    impact: s => tg.HapticFeedback?.impactOccurred(s || 'light'),
    notify: t => tg.HapticFeedback?.notificationOccurred(t),
    select: () => tg.HapticFeedback?.selectionChanged()
};
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.floor(Number(n) || 0).toLocaleString('ru-RU');
const rar = r => /leg|лег/i.test(r) ? 'r3' : /epic|эпи/i.test(r) ? 'r2' : /rare|ред/i.test(r) ? 'r1' : 'r0';

function toast(text, err) {
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' err' : '');
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
}

/* ======================= Кот ======================= */
const CAT = `
<svg viewBox="0 0 200 200" id="cat" role="img" aria-label="Грустный кот на монете">
  <defs><radialGradient id="brass" cx=".35" cy=".28" r=".95">
    <stop offset="0" stop-color="#f8dd86"/><stop offset=".55" stop-color="#e0a93b"/><stop offset="1" stop-color="#a8751d"/></radialGradient></defs>
  <circle cx="100" cy="100" r="97" fill="url(#brass)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 7"/>
  <path d="M47 82 L55 36 L92 62 Z" fill="#8c95a9"/><path d="M153 82 L145 36 L108 62 Z" fill="#8c95a9"/>
  <path d="M56 70 L60 49 L78 62 Z" fill="#d79aa6"/><path d="M144 70 L140 49 L122 62 Z" fill="#d79aa6"/>
  <ellipse cx="100" cy="106" rx="57" ry="50" fill="#a4adbf"/>
  <circle cx="78" cy="106" r="10" fill="#1c2233"/><circle cx="122" cy="106" r="10" fill="#1c2233"/>
  <circle cx="75" cy="102" r="3.4" fill="#fff"/><circle cx="119" cy="102" r="3.4" fill="#fff"/>
  <path class="lid" d="M63 88 L94 88 L94 96 L63 105 Z" fill="#a4adbf"/>
  <path class="lid" d="M137 88 L106 88 L106 96 L137 105 Z" fill="#a4adbf"/>
  <path d="M94 119 L106 119 L100 126 Z" fill="#d79aa6"/>
  <path d="M89 138 Q100 128 111 138" fill="none" stroke="#1c2233" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#1c2233" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round">
    <path d="M62 124 L40 120"/><path d="M62 130 L41 134"/><path d="M138 124 L160 120"/><path d="M138 130 L159 134"/></g>
  <path class="tear" d="M73 117 q-6 10 0 14 q6 -4 0 -14z" fill="#7cc7ff"/>
  <path class="tear t2" d="M127 117 q-6 10 0 14 q6 -4 0 -14z" fill="#7cc7ff"/>
</svg>`;

function cry() {
    const c = $('#cat'); if (!c) return;
    c.classList.remove('cry'); void c.getBoundingClientRect(); c.classList.add('cry');
}

/* ======================= Демо-«сервер» (только для просмотра без бэкенда) ======================= */
const mockServer = (() => {
    const items = {
        mouse: { name: 'Мышка-игрушка', rarity: 'Обычный', value: 120, icon: '🐭' },
        yarn: { name: 'Клубок', rarity: 'Обычный', value: 200, icon: '🧶' },
        fish: { name: 'Золотая рыбка', rarity: 'Редкий', value: 700, icon: '🐟' },
        umbrella: { name: 'Зонтик грусти', rarity: 'Редкий', value: 1000, icon: '☂️' },
        crown: { name: 'Корона кота', rarity: 'Эпический', value: 4000, icon: '👑' },
        diamond: { name: 'Алмазный мяч', rarity: 'Легендарный', value: 20000, icon: '💎' }
    };
    const cases = {
        basic: { name: 'Дождливый кейс', price: 500, drops: { mouse: 40, yarn: 35, fish: 15, umbrella: 8, crown: 2 } },
        silver: { name: 'Лунный кейс', price: 3000, drops: { yarn: 15, fish: 30, umbrella: 30, crown: 22, diamond: 3 } },
        gold: { name: 'Золотой кейс', price: 10000, drops: { umbrella: 20, crown: 55, diamond: 25 } }
    };
    const cfg = { tap: [100, 1.6], pass: [400, 1.7], energy: [150, 1.5] };
    const T = [['earn1', 'Заработать 10 000 монет', 'earned', 1e4, 1000], ['taps1', 'Сделать 1 000 тапов', 'taps', 1000, 1500],
               ['case1', 'Открыть 5 кейсов', 'opened', 5, 2000]];
    const u = { coins: 1000, energy: 500, ts: Date.now() / 1e3, lv: { tap: 0, pass: 0, energy: 0 }, inv: {},
                taps: 0, opened: 0, earned: 0, last_daily: 0, streak: 0, claimed: {} };
    const cost = t => Math.floor(cfg[t][0] * cfg[t][1] ** u.lv[t]);
    const maxE = () => 500 + 100 * u.lv.energy;
    const dly = () => {
        const since = u.last_daily ? Date.now() / 1e3 - u.last_daily : 1e9;
        const nxt = u.last_daily && since < 172800 ? u.streak + 1 : 1;
        return { left: Math.max(0, Math.floor(86400 - since)), reward: 500 * Math.min(nxt, 10), nxt };
    };
    const snap = () => {
        const d = dly();
        return JSON.parse(JSON.stringify({
            me: { id: 1, name: 'Ты', coins: u.coins, energy: u.energy, max_energy: maxE(), tap_power: 1 + u.lv.tap, passive: 100 * u.lv.pass, regen: 1 },
            lv: u.lv, costs: { tap: cost('tap'), pass: cost('pass'), energy: cost('energy') }, cases, items, inv: u.inv,
            daily: { left: d.left, reward: d.reward, streak: u.streak }, link: 'https://t.me/your_bot?start=ref_1',
            tasks: T.map(([key, title, c, goal, reward]) => ({ key, title, goal, reward, progress: Math.min(goal, Math.floor(u[c])), done: !!u.claimed[key] })),
            top: [{ name: 'Барсик', coins: 1250000 }, { name: 'Мурка', coins: 830000 }, { name: 'Пушок', coins: 120000 }, { name: 'Ты', coins: Math.floor(u.coins), me: true }]
                .sort((a, b) => b.coins - a.coins), rank: 4
        }));
    };
    return (action, d) => {
        const now = Date.now() / 1e3, dt = now - u.ts; u.ts = now;
        u.energy = Math.min(maxE(), u.energy + dt);
        const g = 100 * u.lv.pass / 3600 * Math.min(dt, 10800); u.coins += g; u.earned += g;
        const err = m => ({ error: m, state: snap() });
        if (action === 'tap') {
            const tp = 1 + u.lv.tap, k = Math.min(Math.max(0, Math.min(+d.n || 0, 200)), Math.floor(u.energy / tp));
            u.coins += k * tp; u.earned += k * tp; u.energy -= k * tp; u.taps += k;
        } else if (action === 'open') {
            const c = cases[d.case]; if (!c) return err('Кейс не найден'); if (u.coins < c.price) return err('Не хватает монет');
            u.coins -= c.price; u.opened++;
            let r = Math.random() * 100, drop = Object.keys(c.drops)[0];
            for (const [k, w] of Object.entries(c.drops)) { r -= w; if (r <= 0) { drop = k; break; } }
            u.inv[drop] = (u.inv[drop] || 0) + 1; return { drop, state: snap() };
        } else if (action === 'sell') {
            const ks = d.item === 'all' ? Object.keys(u.inv) : (u.inv[d.item] ? [d.item] : []);
            if (!ks.length) return err('Предмет не найден');
            ks.forEach(k => { u.coins += items[k].value * u.inv[k]; delete u.inv[k]; });
        } else if (action === 'upgrade') {
            if (!cfg[d.type]) return err('Неизвестное улучшение'); const c = cost(d.type);
            if (u.coins < c) return err('Не хватает монет'); u.coins -= c; u.lv[d.type]++;
        } else if (action === 'daily') {
            const x = dly(); if (x.left > 0) return err('Бонус ещё не готов');
            u.coins += x.reward; u.streak = x.nxt; u.last_daily = now;
        } else if (action === 'claim') {
            const t = T.find(x => x[0] === d.task); if (!t || u.claimed[t[0]] || u[t[2]] < t[3]) return err('Задание не выполнено');
            u.claimed[t[0]] = 1; u.coins += t[4];
        }
        return { state: snap() };
    };
})();

/* ======================= Состояние и API ======================= */
let state = null, currentTab = 'tap', lastTab = null;
let pending = 0, flushP = null;
const busy = new Set();

async function api(action, data = {}, { lock = true, silent = false } = {}) {
    if (lock) { if (busy.has(action)) return null; busy.add(action); }
    try {
        let json;
        if (DEMO) json = mockServer(action, data);
        else {
            const res = await fetch('/api/' + action, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Init-Data': initData }, body: JSON.stringify(data)
            });
            json = await res.json();
        }
        if (json.error && !silent) { hap.notify('error'); tg.showAlert(json.error); }
        if (json.state) applyState(json.state, action === 'tap');
        return json;
    } catch (e) {
        console.error(e);
        if (!silent) toast('Нет связи с сервером', true);
        return null;
    } finally { if (lock) busy.delete(action); }
}

function applyState(s, fromTap) {
    state = s;
    if (pending > 0) { // тапы, сделанные пока шёл запрос, накладываем поверх ответа
        const t = pending * s.me.tap_power;
        s.me.coins += t; s.me.energy = Math.max(0, s.me.energy - t);
    }
    updateHud();
    if (fromTap && currentTab === 'tap' && lastTab === 'tap') updateTap(); else render();
}

function flushTaps() {
    if (flushP) return flushP;
    if (!pending) return Promise.resolve();
    const n = pending; pending = 0;
    flushP = (async () => {
        try { const r = await api('tap', { n }, { lock: false, silent: true }); if (!r) pending += n; }
        finally { flushP = null; }
    })();
    return flushP;
}
async function syncTaps() { await flushTaps(); if (pending) await flushTaps(); }
async function syncState() { await syncTaps(); return api('state', {}, { silent: true }); }

/* ======================= Отрисовка ======================= */
function updateHud() {
    if (!state) return;
    $('#balance').textContent = fmt(state.me.coins);
    $('#energy').textContent = Math.floor(state.me.energy) + '/' + state.me.max_energy;
}

function updateTap() {
    if (!state || !$('#tapPower')) return;
    const m = state.me;
    $('#tapPower').textContent = '+' + m.tap_power;
    $('#passive').textContent = fmt(m.passive);
    $('#energyTxt').textContent = Math.floor(m.energy) + ' / ' + m.max_energy;
    $('#energyBar').style.width = Math.min(100, m.energy / m.max_energy * 100) + '%';
    $('#cat')?.classList.toggle('tired', m.energy / m.max_energy < 0.1);
}

function updateDaily() {
    const el = $('#dailyTimer');
    if (el && state) el.textContent = `Бонус дня через ${Math.floor(state.daily.left / 3600)} ч ${Math.floor(state.daily.left % 3600 / 60)} мин`;
}

function switchTab(tab) {
    currentTab = tab; hap.select();
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.key === tab));
    render(); $('#view').scrollTop = 0;
}

const UPS = [
    { k: 'tap', t: 'Сила тапа', d: s => `+${s.me.tap_power} → +${s.me.tap_power + 1} за тап` },
    { k: 'pass', t: 'Пассивный доход', d: s => `${fmt(s.me.passive)} → ${fmt(s.me.passive + 100)} в час` },
    { k: 'energy', t: 'Запас энергии', d: s => `${s.me.max_energy} → ${s.me.max_energy + 100}` }
];
const itemOf = k => state?.items?.[k] || { name: k, rarity: '', value: 0, icon: '🎁' };

function render() {
    const view = $('#view');
    if (!state) {
