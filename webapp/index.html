<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SadCat Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        .tap-btn { transition: transform 0.04s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tap-btn:active { transform: scale(0.92); }
        @keyframes floatUp {
            0% { transform: translate(-50%, 0px) scale(0.8); opacity: 1; }
            50% { transform: translate(-50%, -50px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(1); opacity: 0; }
        }
        .floating-num { animation: floatUp 0.5s ease-out forwards; }
        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Top Stats Bar -->
    <div class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center shadow-xl z-20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-yellow-500/20 border border-yellow-500/40 flex items-center justify-center text-2xl">🐱</div>
            <div>
                <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Баланс</div>
                <div class="text-xl font-black text-yellow-400 tracking-tight" id="balance">0</div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Энергия</div>
            <div class="text-sm font-bold text-emerald-400" id="energy">500/500</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div id="content" class="flex-1 overflow-y-auto p-4 pb-28">
        <!-- Динамический контент вкладок -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="absolute bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800/80 flex justify-around py-3 px-1 z-50 shadow-2xl">
        <button onclick="switchTab('tap')" class="tab-btn flex flex-col items-center text-slate-400 hover:text-yellow-400 text-[11px] font-medium transition-colors" data-tab="tap">
            <span class="text-xl mb-0.5">👆</span>Тап
        </button>
        <button onclick="switchTab('cases')" class="tab-btn flex flex-col items-center text-slate-400 hover:text-yellow-400 text-[11px] font-medium transition-colors" data-tab="cases">
            <span class="text-xl mb-0.5">🎁</span>Кейсы
        </button>
        <button onclick="switchTab('inv')" class="tab-btn flex flex-col items-center text-slate-400 hover:text-yellow-400 text-[11px] font-medium transition-colors" data-tab="inv">
            <span class="text-xl mb-0.5">🎒</span>Инвентарь
        </button>
        <button onclick="switchTab('up')" class="tab-btn flex flex-col items-center text-slate-400 hover:text-yellow-400 text-[11px] font-medium transition-colors" data-tab="up">
            <span class="text-xl mb-0.5">⬆️</span>Прокачка
        </button>
        <button onclick="switchTab('tasks')" class="tab-btn flex flex-col items-center text-slate-400 hover:text-yellow-400 text-[11px] font-medium transition-colors" data-tab="tasks">
            <span class="text-xl mb-0.5">📋</span>Задания
        </button>
        <button onclick="switchTab('top')" class="tab-btn flex flex-col items-center text-slate-400 hover:text-yellow-400 text-[11px] font-medium transition-colors" data-tab="top">
            <span class="text-xl mb-0.5">🏆</span>Топ
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');

        const initData = tg.initData || '';
        let state = null;
        let currentTab = 'tap';

        async function api(action, data = {}) {
            try {
                const res = await fetch('/api/' + action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Init-Data': initData },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (json.error) {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert(json.error);
                }
                if (json.state) updateState(json.state);
                return json;
            } catch (e) {
                console.error(e);
            }
        }

        function updateState(newState) {
            state = newState;
            document.getElementById('balance').innerText = state.me.coins.toLocaleString();
            document.getElementById('energy').innerText = state.me.energy + '/' + state.me.max_energy;
            renderTab();
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.add('text-yellow-400', 'scale-105');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-yellow-400', 'scale-105');
                    btn.classList.add('text-slate-400');
                }
            });
            renderTab();
        }

        function renderTab() {
            if (!state) return;
            const container = document.getElementById('content');
            
            if (currentTab === 'tap') {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-between h-full py-4 space-y-4">
                        <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3 flex justify-around text-center shadow-lg">
                            <div>
                                <div class="text-[10px] uppercase text-slate-400">Сила тапа</div>
                                <div class="text-base font-bold text-yellow-400">+${state.me.tap_power}</div>
                            </div>
                            <div class="w-[1px] bg-slate-800"></div>
                            <div>
                                <div class="text-[10px] uppercase text-slate-400">Пассив / час</div>
                                <div class="text-base font-bold text-emerald-400">${state.me.passive.toLocaleString()}</div>
                            </div>
                        </div>

                        <div class="flex-1 flex items-center justify-center">
                            <button onpointerdown="doTap(event)" class="tap-btn w-56 h-56 bg-gradient-to-tr from-amber-600 via-yellow-500 to-yellow-300 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(234,179,8,0.25)] border-8 border-yellow-200/40 cursor-pointer relative overflow-hidden">
                                <div class="absolute inset-0 bg-white/10 rounded-full filter blur-sm"></div>
                                <span class="text-9xl select-none pointer-events-none drop-shadow-lg transform transition-transform">🐱</span>
                            </button>
                        </div>

                        <div class="w-full space-y-2">
                            <div class="flex justify-between text-xs font-semibold text-slate-400 px-1">
                                <span>⚡ Заряд энергии</span>
                                <span class="text-emerald-400">${state.me.energy} / ${state.me.max_energy}</span>
                            </div>
                            <div class="w-full bg-slate-900 rounded-full h-4 p-0.5 border border-slate-800 shadow-inner">
                                <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-150 shadow-[0_0_10px_rgba(16,185,129,0.5)]" style="width: ${(state.me.energy / state.me.max_energy) * 100}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'cases') {
                let html = '<div class="space-y-4"><h2 class="text-xl font-black mb-2 flex items-center gap-2">🎁 Магазин кейсов</h2>';
                for (const [key, c] of Object.entries(state.cases)) {
                    html += `
                        <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 shadow-xl relative overflow-hidden">
                            <div class="flex justify-between items-center mb-3">
                                <div>
                                    <div class="font-extrabold text-lg text-slate-100">${c.name}</div>
                                    <div class="text-xs text-yellow-400 font-bold mt-0.5">${c.price.toLocaleString()} 💰</div>
                                </div>
                                <button onclick="openCase('${key}')" class="bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 hover:to-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl shadow-lg shadow-yellow-500/20 active:scale-95 transition-all text-sm">Открыть</button>
                            </div>
                            <div class="bg-slate-950/50 rounded-xl p-2.5 border border-slate-800/50 text-[11px] text-slate-400 space-y-1">
                                <div class="font-semibold text-slate-300 mb-1">Возможный дроп:</div>
                                ${Object.entries(c.drops).map(([i, w]) => `<div class="flex justify-between"><span>${state.items[i].name} (${state.items[i].rarity})</span><span class="text-yellow-500/90 font-mono">${w}%</span></div>`).join('')}
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html + '</div>';
            } else if (currentTab === 'inv') {
                let itemsHtml = '';
                const inv = state.inv;
                if (Object.keys(inv).length === 0) {
                    itemsHtml = '<div class="text-center text-slate-500 py-20"><div class="text-5xl mb-3">📦</div>Инвентарь пуст.<br>Открывайте кейсы во вкладке «Кейсы»!</div>';
                } else {
                    itemsHtml = '<div class="grid grid-cols-1 gap-3">';
                    for (const [itemKey, qty] of Object.entries(inv)) {
                        const item = state.items[itemKey];
                        itemsHtml += `
                            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 flex justify-between items-center shadow-lg">
                                <div class="space-y-0.5">
                                    <div class="font-bold text-base">${item.name} <span class="text-xs text-yellow-400 font-normal">×${qty}</span></div>
                                    <div class="text-xs text-slate-400">${item.rarity} · Продажа: <span class="text-yellow-400 font-semibold">${item.value.toLocaleString()} 💰</span></div>
                                </div>
                                <button onclick="sellItem('${itemKey}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3.5 py-2 rounded-xl text-xs font-bold active:scale-95 transition">Продать</button>
                            </div>
                        `;
                    }
                    itemsHtml += '</div><button onclick="sellItem(\'all\')" class="w-full mt-5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3.5 rounded-2xl shadow-xl shadow-red-600/25 active:scale-95 transition">Продать всё за монеты</button>';
                }
                container.innerHTML = `<h2 class="text-xl font-black mb-4">🎒 Инвентарь предметов</h2>` + itemsHtml;
            } else if (currentTab === 'up') {
                container.innerHTML = `
                    <h2 class="text-xl font-black mb-4">⬆️ Прокачка</h2>
                    <div class="space-y-4">
                        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-xl">
                            <div>
                                <div class="font-bold text-base">Сила тапа (+1)</div>
                                <div class="text-xs text-slate-400 mt-0.5">Текущая мощь: <span class="text-yellow-400 font-semibold">+${state.me.tap_power}</span></div>
                            </div>
                            <button onclick="buyUpgrade('tap')" class="bg-gradient-to-r from-yellow-500 to-amber-500 text-slate-950 font-black px-4 py-2.5 rounded-xl shadow-lg active:scale-95 transition text-sm">${state.costs.tap.toLocaleString()} 💰</button>
                        </div>
                        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-xl">
                            <div>
                                <div class="font-bold text-base">Пассивный доход (+100/ч)</div>
                                <div class="text-xs text-slate-400 mt-0.5">Доход в час: <span class="text-emerald-400 font-semibold">${state.me.passive.toLocaleString()}</span></div>
                            </div>
                            <button onclick="buyUpgrade('pass')" class="bg-gradient-to-r from-yellow-500 to-amber-500 text-slate-950 font-black px-4 py-2.5 rounded-xl shadow-lg active:scale-95 transition text-sm">${state.costs.pass.toLocaleString()} 💰</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'tasks') {
                let tasksHtml = '';
                if (state.daily.left <= 0) {
                    tasksHtml += `<button onclick="claimDaily()" class="w-full mb-4 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-3.5 rounded-2xl shadow-xl shadow-emerald-600/25 active:scale-95 transition">🎁 Забрать ежедневный бонус (+${state.daily.reward.toLocaleString()})</button>`;
                } else {
                    const h = Math.floor(state.daily.left / 3600);
                    const m = Math.floor((state.daily.left % 3600) / 60);
                    tasksHtml += `<div class="bg-slate-900/60 border border-slate-800 text-center p-3.5 rounded-2xl mb-4 text-slate-400 text-xs">🎁 Ежедневный бонус будет доступен через ${h}ч ${m}м</div>`;
                }

                tasksHtml += `
                    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-4 shadow-xl">
                        <div class="font-bold text-sm mb-1">🔗 Реферальная ссылка</div>
                        <div class="text-xs text-slate-400 mb-2">Приглашайте друзей и получайте крутые бонусы!</div>
                        <input type="text" readonly value="${state.link}" onclick="this.select()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-yellow-400 font-mono select-all focus:outline-none">
                    </div>
                `;

                for (const t of state.tasks) {
                    tasksHtml += `
                        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-3 flex justify-between items-center shadow-xl">
                            <div>
                                <div class="font-bold text-sm">${t.title}</div>
                                <div class="text-xs text-slate-400 mt-0.5">${t.progress.toLocaleString()} / ${t.goal.toLocaleString()} · <span class="text-yellow-400 font-semibold">+${t.reward.toLocaleString()} 💰</span></div>
                            </div>
                            ${t.done ? '<span class="text-emerald-400 font-bold text-xs bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-xl">✓ Выполнено</span>' : (t.progress >= t.goal ? `<button onclick="claimTask('${t.key}')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs shadow-lg active:scale-95 transition">Забрать</button>` : '<span class="text-slate-500 text-xs">В процессе</span>')}
                        </div>
                    `;
                }
                container.innerHTML = `<h2 class="text-xl font-black mb-4">📋 Задания и Бонусы</h2>` + tasksHtml;
            } else if (currentTab === 'top') {
                let topHtml = '<div class="space-y-2">';
                state.top.forEach((u, index) => {
                    let rankBg = index === 0 ? 'bg-yellow-500/10 border-yellow-500/40 text-yellow-400' : (index === 1 ? 'bg-slate-300/10 border-slate-300/30 text-slate-200' : (index === 2 ? 'bg-amber-700/10 border-amber-700/30 text-amber-500' : 'bg-slate-900/80 border-slate-800 text-slate-400'));
                    topHtml += `
                        <div class="border rounded-2xl p-3.5 flex justify-between items-center shadow-lg ${rankBg}">
                            <div class="flex items-center space-x-3">
                                <span class="font-black w-6 text-center text-sm">#${index + 1}</span>
                                <span class="font-bold text-slate-100 text-sm">${u.name}</span>
                            </div>
                            <span class="font-black text-yellow-400 text-sm">${u.coins.toLocaleString()} 💰</span>
                        </div>
                    `;
                });
                container.innerHTML = `<h2 class="text-xl font-black mb-4">🏆 Топ-10 игроков</h2>` + topHtml + '</div>';
            }
        }

        async function doTap(e) {
            const res = await api('tap', { n: 1 });
            if (res && res.counted) {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                
                // Мультитач / точные координаты тапа
                const clientX = e.clientX || (e.touches && e.touches[0].clientX) || (window.innerWidth / 2);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY) || (window.innerHeight / 2);
                
                const el = document.createElement('div');
                el.innerText = '+' + state.me.tap_power;
                el.className = 'fixed floating-num text-yellow-400 font-black text-2xl pointer-events-none z-50 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]';
                el.style.left = clientX + 'px';
                el.style.top = clientY + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 500);
            }
        }

        async function openCase(caseKey) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            const res = await api('open', { case: caseKey });
            if (res && res.drop) {
                const item = state.items[res.drop];
                tg.showAlert(`🎉 Поздравляем!\n\nВам выпало:\n${item.name}\nРедкость: ${item.rarity}\nЦена продажи: ${item.value.toLocaleString()} 💰`);
            }
        }

        async function sellItem(itemKey) { 
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            await api('sell', { item: itemKey }); 
        }

        async function buyUpgrade(kind) { 
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            await api('buy', { kind: kind }); 
        }

        asyn
