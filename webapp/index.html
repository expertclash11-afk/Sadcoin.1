<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SadCat Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --bg-deep: #060913;
            --card-bg: rgba(15, 23, 42, 0.85);
        }
        body { 
            background-color: var(--bg-deep); 
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #060913 70%);
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            touch-action: manipulation; 
            user-select: none; 
            -webkit-user-select: none; 
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .coin-btn { 
            transition: transform 0.06s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: radial-gradient(circle at 30% 30%, #fde047 0%, #eab308 50%, #ca8a04 100%);
            box-shadow: 0 15px 35px rgba(234, 179, 8, 0.3), inset 0 2px 6px rgba(255, 255, 255, 0.6), inset 0 -4px 8px rgba(0, 0, 0, 0.4);
        }
        .coin-btn:active { 
            transform: scale(0.92); 
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, 0px) scale(0.8); opacity: 1; }
            50% { transform: translate(-50%, -60px) scale(1.25); opacity: 1; }
            100% { transform: translate(-50%, -120px) scale(1); opacity: 0; }
        }
        .floating-num { animation: floatUp 0.55s ease-out forwards; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Top Bar -->
    <div class="glass-card border-b p-4 flex justify-between items-center z-20 shadow-2xl">
        <div class="flex items-center space-x-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-yellow-500 to-amber-300 flex items-center justify-center text-2xl shadow-lg shadow-yellow-500/20">🪙</div>
            <div>
                <div class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Баланс SadCoin</div>
                <div class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-500 tracking-tight" id="balance">0</div>
            </div>
        </div>
        <div class="text-right glass-card px-3 py-1.5 rounded-xl border border-white/5">
            <div class="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">Энергия</div>
            <div class="text-xs font-black text-emerald-400" id="energy">500/500</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="content" class="flex-1 overflow-y-auto p-4 pb-28"></div>

    <!-- Bottom Navigation -->
    <div class="absolute bottom-0 left-0 right-0 glass-card border-t border-white/10 flex justify-around py-3 px-1 z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        <button onclick="switchTab('tap')" class="tab-btn flex flex-col items-center text-yellow-400 scale-105 text-[11px] font-semibold transition-all" data-tab="tap">
            <span class="text-xl mb-0.5">🪙</span>Тап
        </button>
        <button onclick="switchTab('cases')" class="tab-btn flex flex-col items-center text-slate-400 text-[11px] font-semibold transition-all" data-tab="cases">
            <span class="text-xl mb-0.5">🎁</span>Кейсы
        </button>
        <button onclick="switchTab('inv')" class="tab-btn flex flex-col items-center text-slate-400 text-[11px] font-semibold transition-all" data-tab="inv">
            <span class="text-xl mb-0.5">🎒</span>Инвентарь
        </button>
        <button onclick="switchTab('up')" class="tab-btn flex flex-col items-center text-slate-400 text-[11px] font-semibold transition-all" data-tab="up">
            <span class="text-xl mb-0.5">⚡</span>Прокачка
        </button>
        <button onclick="switchTab('tasks')" class="tab-btn flex flex-col items-center text-slate-400 text-[11px] font-semibold transition-all" data-tab="tasks">
            <span class="text-xl mb-0.5">📋</span>Задания
        </button>
        <button onclick="switchTab('top')" class="tab-btn flex flex-col items-center text-slate-400 text-[11px] font-semibold transition-all" data-tab="top">
            <span class="text-xl mb-0.5">🏆</span>Топ
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#060913');

        const initData = tg.initData || '';
        let state = null;
        let currentTab = 'tap';

        async function api(action, data = {}) {
            try {
                const res = await fetch('/api/' + action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Init-Data': initData },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (json.error) {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert(json.error);
                }
                if (json.state) updateState(json.state);
                return json;
            } catch (e) { console.error(e); }
        }

        function updateState(newState) {
            state = newState;
            document.getElementById('balance').innerText = state.me.coins.toLocaleString();
            document.getElementById('energy').innerText = Math.floor(state.me.energy) + '/' + state.me.max_energy;
            renderTab();
        }

        function switchTab(tab) {
            currentTab = tab;
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.add('text-yellow-400', 'scale-105');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-yellow-400', 'scale-105');
                    btn.classList.add('text-slate-400');
                }
            });
            renderTab();
        }

        function renderTab() {
            if (!state) return;
            const container = document.getElementById('content');
            
            if (currentTab === 'tap') {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-between h-full py-2 space-y-4">
                        <div class="w-full glass-card rounded-2xl p-3 flex justify-around text-center shadow-lg border border-white/5">
                            <div>
                                <div class="text-[10px] uppercase text-slate-400 font-bold">Сила тапа</div>
                                <div class="text-base font-black text-yellow-400">+${state.me.tap_power}</div>
                            </div>
                            <div class="w-[1px] bg-white/10"></div>
                            <div>
                                <div class="text-[10px] uppercase text-slate-400 font-bold">Пассив / час</div>
                                <div class="text-base font-black text-emerald-400">${state.me.passive.toLocaleString()}</div>
                            </div>
                        </div>

                        <div class="flex-1 flex items-center justify-center my-4">
                            <button onpointerdown="doTap(event)" class="coin-btn w-60 h-60 rounded-full flex flex-col items-center justify-center cursor-pointer relative border-4 border-yellow-200/50">
                                <div class="absolute inset-3 rounded-full border-2 border-dashed border-yellow-100/30 pointer-events-none"></div>
                                <span class="text-7xl select-none pointer-events-none filter drop-shadow-md">🪙</span>
                                <span class="text-xs font-black tracking-widest text-yellow-950 uppercase mt-1 bg-yellow-300/60 px-3 py-0.5 rounded-full backdrop-blur-sm">SadCoin</span>
                            </button>
                        </div>

                        <div class="w-full space-y-2">
                            <div class="flex justify-between text-xs font-bold text-slate-400 px-1">
                                <span>⚡ Энергия</span>
                                <span class="text-emerald-400 font-mono">${Math.floor(state.me.energy)} / ${state.me.max_energy}</span>
                            </div>
                            <div class="w-full bg-slate-950/80 rounded-full h-4 p-0.5 border border-white/10 shadow-inner">
                                <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-150 shadow-[0_0_12px_rgba(16,185,129,0.5)]" style="width: ${(state.me.energy / state.me.max_energy) * 100}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'cases') {
                let html = '<div class="space-y-3"><h2 class="text-lg font-black mb-3 text-slate-200 flex items-center gap-2">🎁 Магазин кейсов</h2>';
                for (const [key, c] of Object.entries(state.cases)) {
                    html += `
                        <div class="glass-card rounded-2xl p-4 shadow-xl border border-white/5 relative overflow-hidden">
                            <div class="flex justify-between items-center mb-3">
                                <div>
                                    <div class="font-extrabold text-base text-slate-100">${c.name}</div>
                                    <div class="text-xs text-yellow-400 font-bold mt-0.5">${c.price.toLocaleString()} 🪙</div>
                                </div>
                                <button onclick="openCase('${key}')" class="bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 hover:to-amber-400 text-slate-950 font-black px-4 py-2.5 rounded-xl shadow-lg shadow-yellow-500/20 active:scale-95 transition-all text-xs">Открыть</button>
                            </div>
                            <div class="bg-slate-950/40 rounded-xl p-2.5 border border-white/5 text-[11px] text-slate-400 space-y-1">
                                <div class="font-semibold text-slate-300 mb-1">Возможный дроп:</div>
                                ${Object.entries(c.drops).map(([i, w]) => `<div class="flex justify-between"><span>${state.items[i].name} (${state.items[i].rarity})</span><span class="text-yellow-400 font-mono font-bold">${w}%</span></div>`).join('')}
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html + '</div>';
            } else if (currentTab === 'inv') {
                let itemsHtml = '';
                const inv = state.inv;
                if (Object.keys(inv).length === 0) {
                    itemsHtml = '<div class="text-center text-slate-500 py-20"><div class="text-5xl mb-3">📦</div>Инвентарь пуст.<br>Открывайте кейсы во вкладке «Кейсы»!</div>';
                } else {
                    itemsHtml = '<div class="grid grid-cols-1 gap-2.5">';
                    for (const [itemKey, qty] of Object.entries(inv)) {
                        const item = state.items[itemKey];
                        itemsHtml += `
                            <div class="glass-card rounded-2xl p-3.5 flex justify-between items-center shadow-lg border border-white/5">
                                <div class="space-y-0.5">
                                    <div class="font-bold text-sm">${item.name} <span class="text-xs text-yellow-400 font-bold">×${qty}</span></div>
                                    <div class="text-[11px] text-slate-400">${item.rarity} · Цена: <span class="text-yellow-400 font-semibold">${item.value.toLocaleString()} 🪙</span></div>
                                </div>
                                <button onclick="sellItem('${itemKey}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-xl text-xs font-bold active:scale-95 transition">Продать</button>
                            </div>
                        `;
                    }
                    itemsHtml += '</div><button onclick="sellItem(\'all\')" class="w-full mt-4 bg-gradient-to-r from-red-600 to-rose-600 text-white font-bold py-3 rounded-2xl shadow-xl shadow-red-600/25 active:scale-95 transition text-sm">Продать всё за монеты</button>';
                }
                container.innerHTML = `<h2 class="text-lg font-black mb-3 text-slate-200">🎒 Инвентарь</h2>` + itemsHtml;
            } else if (currentTab === 'up') {
                container.innerHTML = `
                    <h2 class="text-lg font-black mb-3 text-slate-200">⚡ Улучшения</h2>
                    <div class="space-y-3">
                        <div class="glass-card rounded-2xl p-4 flex justify-between items-center shadow-xl border border-white/5">
                            <div>
                                <div class="font-bold text-sm">Сила тапа (+1)</div>
                                <div class="text-xs text-slate-400 mt-0.5">Мощь: <span class="text-yellow-400 font-semibold">+${state.me.tap_power}</span></div>
                            </div>
                            <button onclick="buyUpgrade('tap')" class="bg-gradient-to-r from-yellow-500 to-amber-500 text-slate-950 font-black px-4 py-2.5 rounded-xl shadow-lg active:scale-95 transition text-xs">${state.costs.tap.toLocaleString()} 🪙</button>
                        </div>
                        <div class="glass-card rounded-2xl p-4 flex justify-between items-center shadow-xl border border-white/5">
                            <div>
                                <div class="font-bold text-sm">Пассивный доход (+100/ч)</div>
                                <div class="text-xs text-slate-400 mt-0.5">Доход: <span class="text-emerald-400 font-semibold">${state.me.passive.toLocaleString()}/ч</span></div>
                            </div>
                            <button onclick="buyUpgrade('pass')" class="bg-gradient-to-r from-yellow-500 to-amber-500 text-slate-950 font-black px-4 py-2.5 rounded-xl shadow-lg active:scale-95 transition text-xs">${state.costs.pass.toLocaleString()} 🪙</button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'tasks') {
                let tasksHtml = '';
                if (state.daily.left <= 0) {
                    tasksHtml += `<button onclick="claimDaily()" class="w-full mb-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-3 rounded-2xl shadow-xl shadow-emerald-600/25 active:scale-95 transition text-sm">🎁 Забрать ежедневный бонус (+${state.daily.reward.toLocaleString()})</button>`;
                } else {
                    const h = Math.floor(state.daily.left / 3600);
                    const m = Math.floor((state.daily.left % 3600) / 60);
                    tasksHtml += `<div class="glass-card text-center p-3 rounded-2xl mb-3 text-slate-400 text-xs border border-white/5">🎁 Ежедневный бонус через ${h}ч ${m}м</div>`;
                }

                tasksHtml += `
                    <div class="glass-card rounded-2xl p-4 mb-3 shadow-xl border border-white/5">
                        <div class="font-bold text-xs mb-1">🔗 Реферальная ссылка</div>
                        <input type="text" readonly value="${state.link}" onclick="this.select()" class="w-full bg-slate-950/80 border border-white/10 rounded-xl p-2 text-xs text-yellow-400 font-mono select-all focus:outline-none">
                    </div>
                `;

                for (const t of state.tasks) {
                    tasksHtml += `
                        <div class="glass-card rounded-2xl p-3.5 mb-2.5 flex justify-between items-center shadow-xl border border-white/5">
                            <div>
                                <div class="font-bold text-xs">${t.title}</div>
                                <div class="text-[11px] text-slate-400 mt-0.5">${t.progress.toLocaleString()} / ${t.goal.toLocaleString()} · <span class="text-yellow-400 font-semibold">+${t.reward.toLocaleString()} 🪙</span></div>
                            </div>
                            ${t.done ? '<span class="text-emerald-400 font-bold text-xs bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-xl">✓ Готово</span>' : (t.progress >= t.goal ? `<button onclick="claimTask('${t.key}')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-3.5 py-1.5 rounded-xl text-xs shadow-lg active:scale-95 transition">Забрать</button>` : '<span class="text-slate-500 text-xs">В процессе</span>')}
                        </div>
                    `;
                }
                container.innerHTML = `<h2 class="text-lg font-black mb-3 text-slate-200">📋 Задания</h2>` + tasksHtml;
            } else if (currentTab === 'top') {
                let topHtml = '<div class="space-y-2">';
                state.top.forEach((u, index) => {
                    let rankBg = index === 0 ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-400' : (index === 1 ? 'bg-slate-300/10 border-slate-300/20 text-slate-200' : (index === 2 ? 'bg-amber-700/10 border-amber-700/20 text-amber-500' : 'glass-card text-slate-400'));
                    topHtml += `
                        <div class="border rounded-2xl p-3 flex justify-between items-center shadow-lg ${rankBg}">
                            <div class="flex items-center space-x-3">
                                <span class="font-black w-6 text-center text-xs">#${index + 1}</span>
                                <span class="font-bold text-slate-100 text-xs">${u.name}</span>
                            </div>
                            <span class="font-black text-yellow-400 text-xs">${u.coins.toLocaleString()} 🪙</span>
                        </div>
                    `;
                });
                container.innerHTML = `<h2 class="text-lg font-black mb-3 text-slate-200">🏆 Топ игроков</h2>` + topHtml + '</div>';
            }
        }

        async function doTap(e) {
            const res = await api('tap', { n: 1 });
            if (res && res.counted) {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                
                const clientX = e.clientX || (e.touches && e.touches[0].clientX) || (window.innerWidth / 2);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY) || (window.innerHeight / 2);
                
                const el = document.createElement('div');
                el.innerText = '+' + state.me.tap_power;
                el.className = 'fixed floating-num text-yellow-400 font-black text-2xl pointer-events-none z-50 drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)]';
                el.style.left = clientX + 'px';
                el.style.top = clientY + 'px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 550);
            }
        }

        async function openCase(caseKey) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            const res = await api('open', { case: caseKey });
            if (res && res.drop) {
